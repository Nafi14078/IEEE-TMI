[project]
name = "rwkd"
version = "0.1.0"
description = "Reliability-weighted distillation of a medical VLM into a compact skin-lesion classifier"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
